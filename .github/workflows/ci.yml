name: IEEE/ACM Artifact Evaluation CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ae-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Verify SHA-256 golden checksums
        run: shasum -a 256 -c data/reference/golden_hashes.sha256
      - name: Run unit & AE reproducibility tests
        run: PYTHONPATH=src pytest -v tests/
