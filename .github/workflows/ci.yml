name: Artifact Evaluation CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ae-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install --no-deps -e .
      - name: Verify SHA-256 golden checksums
        run: shasum -a 256 -c data/reference/golden_hashes.sha256
      - name: Public API import smoke test
        run: |
          PYTHONPATH=src python -c "import pcsrc, pcsrc.sos; [getattr(pcsrc.sos, n) for n in pcsrc.sos._LAZY_EXPORTS]; print('OK:', len(pcsrc.sos._LAZY_EXPORTS), 'exports')"
      - name: Run unit & AE reproducibility tests
        run: PYTHONPATH=src pytest -v tests/
