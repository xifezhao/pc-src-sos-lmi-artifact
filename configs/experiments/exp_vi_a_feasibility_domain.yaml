# ==============================================================================
# configs/experiments/exp_vi_a_feasibility_domain.yaml
#
# Experiment VI-A:
#   3D feasible gain domain under increasing delay mismatch bounds.
#
# Paper location:
#   Section VI-A
#   Fig. 5
#
# Purpose:
#   - Sweep controller gains {kp, kv, ka}.
#   - Evaluate SOS-LMI feasibility for different delay mismatch bounds delta_max.
#   - Compare dual-certificate feasibility against the monolithic baseline.
#   - Export data for the 3D feasible-domain shrinkage figure.
#
# Expected command:
#   python -m pcsrc.experiments.exp_vi_a_feasibility_domain \
#       --config configs/experiments/exp_vi_a_feasibility_domain.yaml \
#       --solver-config configs/solver/mosek.yaml
#
# Fast AE command:
#   python -m pcsrc.experiments.exp_vi_a_feasibility_domain \
#       --config configs/experiments/exp_vi_a_feasibility_domain.yaml \
#       --solver-config configs/solver/scs_fallback.yaml \
#       --profile fast
# ==============================================================================


# ------------------------------------------------------------------------------
# 1. Experiment identity
# ------------------------------------------------------------------------------

experiment:
  id: "exp_vi_a_feasibility_domain"
  name: "VI-A Feasible Gain Domain"
  paper_section: "VI-A"
  paper_figure: "Fig. 5"

  description: >
    Computes the 3D feasible controller-gain domain over {kp, kv, ka} for
    increasing delay mismatch bounds delta_max. The experiment visualizes the
    monotonic contraction of the robustly certified gain region as uncertainty
    increases.

  tags:
    - "sos-lmi"
    - "dual-certificate"
    - "feasibility-domain"
    - "robust-control"
    - "figure-5"

  enabled: true
  profile_default: "full"

  dependencies:
    base_config: "configs/default.yaml"
    recommended_solver_config: "configs/solver/mosek.yaml"
    fallback_solver_configs:
      - "configs/solver/sdpt3.yaml"
      - "configs/solver/sedumi.yaml"
      - "configs/solver/scs_fallback.yaml"


# ------------------------------------------------------------------------------
# 2. Physical and model overrides
# ------------------------------------------------------------------------------

physical:
  acceleration_limits:
    min: -3.0
    max: 3.0

traffic:
  platoon:
    num_vehicles_total: 6
    leader_index: 0
    hdv_indices: [1, 2, 3, 4]
    cav_indices: [5]
    controlled_cav_index: 5

  equilibrium:
    nominal_speed: 22.0
    nominal_spacing: 22.0
    time_headway: 1.0


hdv_model:
  type: "linearized_ovm"

  linearized:
    spacing_gain: 0.35
    relative_velocity_gain: 0.55
    velocity_gain: 0.20


cav:
  actuator:
    nominal_tau_e: 0.35
    tau_e_min: 0.20
    tau_e_max: 0.60

  communication:
    nominal_tau_c: 0.18
    tau_c_min: 0.00
    tau_c_max: 0.40

  delay_mismatch:
    nominal_delta_max: 0.08
    delta_max_min: 0.00
    delta_max_max: 0.16


# ------------------------------------------------------------------------------
# 3. Controller gain search domain
# ------------------------------------------------------------------------------

controller:
  name: "PC-SRC"

  gain_bounds:
    kp:
      min: 0.10
      max: 2.60
    kv:
      min: 0.10
      max: 3.00
    ka:
      min: 0.00
      max: 1.25

  nominal_gain:
    kp: 1.15
    kv: 1.18
    ka: 0.61


# ------------------------------------------------------------------------------
# 4. SOS-LMI formulation for this experiment
# ------------------------------------------------------------------------------

sos_lmi:
  formulation:
    use_dual_certificate: true
    use_monolithic_baseline: true
    robust_attenuation_certificate: true
    topology_precondition_certificate: true
    use_schur_lift: true

  polynomial:
    variables:
      - "kp"
      - "kv"
      - "ka"
      - "tau_c"
      - "tau_e"
      - "delta"

    degree:
      certificate_A: 2
      certificate_B: 2
      monolithic: 2
      multipliers: 2

    basis: "monomial"
    basis_scaling: true
    remove_redundant_monomials: true

  positivity_domain:
    gain_box:
      kp: [0.10, 2.60]
      kv: [0.10, 3.00]
      ka: [0.00, 1.25]

    delay_box:
      tau_c: [0.00, 0.40]
      tau_e: [0.20, 0.60]
      delta: [0.00, 0.16]

  feasibility:
    min_lmi_eigenvalue_tolerance: -1.0e-7
    max_primal_residual: 1.0e-6
    max_dual_residual: 1.0e-6
    require_solver_optimal: false


# ------------------------------------------------------------------------------
# 5. Grid sweep settings
# ------------------------------------------------------------------------------

grid:
  mode: "structured"
  deterministic_order: true

  variables:
    kp:
      start: 0.35
      stop: 2.35
      num: 41
      scale: "linear"

    kv:
      start: 0.40
      stop: 2.70
      num: 47
      scale: "linear"

    ka:
      start: 0.20
      stop: 1.05
      num: 18
      scale: "linear"

  fixed_parameters:
    tau_c: 0.18
    tau_e: 0.35

  uncertainty_slices:
    delta_max_values:
      - 0.02
      - 0.08
      - 0.14

  total_grid_points_expected: 34686

  chunking:
    enabled: true
    chunk_size: 256
    save_after_each_chunk: true
    resume_from_partial: true

  parallel:
    enabled: true
    backend: "joblib"
    n_jobs: -1
    prefer: "processes"

  cache:
    enabled: true
    directory: "data/processed/feasibility_grid/cache/exp_vi_a"
    key_fields:
      - "kp"
      - "kv"
      - "ka"
      - "tau_c"
      - "tau_e"
      - "delta_max"
      - "certificate_type"
      - "solver"
      - "config_hash"


# ------------------------------------------------------------------------------
# 6. Certificate evaluation options
# ------------------------------------------------------------------------------

certificates:
  evaluate_dual_certificate: true
  evaluate_monolithic_baseline: true

  dual_certificate:
    stages:
      - id: "A"
        name: "topology_precondition_certificate"
        enabled: true
        output_file: "certificates/dual_certificate/certificate_A_topology_precondition.json"

      - id: "B"
        name: "schur_robustness_certificate"
        enabled: true
        output_file: "certificates/dual_certificate/certificate_B_schur_robustness.json"

    feasibility_rule: "A_and_B_must_pass"

  monolithic_certificate:
    enabled: true
    output_file: "certificates/monolithic_certificate/monolithic_certificate.json"

  residual_checks:
    enabled: true
    save_primal_dual_residuals: true
    save_lmi_eigenvalue_margins: true
    save_polynomial_residuals: true

  infeasible_audit:
    enabled: true
    save_first_n_examples: 100
    output_file: "certificates/verification_logs/infeasible_points_audit.csv"


# ------------------------------------------------------------------------------
# 7. Convex hull and feasible-domain post-processing
# ------------------------------------------------------------------------------

postprocessing:
  feasible_point_filter:
    require_certificate_pass: true
    require_residual_pass: true
    require_eigenvalue_margin_pass: true

  monotonicity_check:
    enabled: true
    expected_direction: "shrinking_with_delta_max"
    tolerance_points: 0

  convex_hull:
    enabled: true
    method: "scipy_spatial_convhull"
    dimensions:
      - "kp"
      - "kv"
      - "ka"

    compute_volume: true
    compute_surface_area: true
    export_vertices: true
    export_facets: true

    qhull_options: "QJ"

    minimum_points_required: 4

  volume_metrics:
    enabled: true
    reference_delta_max: 0.02
    compute_relative_volume: true
    compute_volume_shrinkage_percent: true

  comparison_metrics:
    dual_vs_monolithic:
      enabled: true
      compute_volume_ratio: true
      compute_extra_feasible_points: true
      min_expected_volume_ratio: 1.00


# ------------------------------------------------------------------------------
# 8. Output files
# ------------------------------------------------------------------------------

outputs:
  root: "data/processed/feasibility_grid/exp_vi_a"

  raw_grid:
    dual: "data/processed/feasibility_grid/exp_vi_a/dual_raw_grid.csv"
    monolithic: "data/processed/feasibility_grid/exp_vi_a/monolithic_raw_grid.csv"
    combined: "data/processed/feasibility_grid/exp_vi_a/combined_raw_grid.csv"

  feasible_points:
    dual: "data/processed/feasibility_grid/exp_vi_a/dual_feasible_points.csv"
    monolithic: "data/processed/feasibility_grid/exp_vi_a/monolithic_feasible_points.csv"
    by_delta_template: "data/processed/feasibility_grid/exp_vi_a/dual_feasible_delta_{delta_max:.2f}.csv"

  convex_hull:
    vertices_template: "data/processed/feasibility_grid/exp_vi_a/hull_vertices_delta_{delta_max:.2f}.csv"
    facets_template: "data/processed/feasibility_grid/exp_vi_a/hull_facets_delta_{delta_max:.2f}.csv"
    metrics: "data/processed/feasibility_grid/exp_vi_a/hull_metrics.csv"

  figure_data:
    fig5_csv: "data/processed/feasibility_grid/fig5_gain_feasible_domain.csv"
    fig5_hulls_json: "data/processed/feasibility_grid/fig5_hulls.json"
    fig5_pgfplots_vertices: "results/figures/fig5_gain_feasible_domain_vertices.dat"

  certificates:
    dual_residual_report: "certificates/dual_certificate/residual_report_exp_vi_a.json"
    monolithic_residual_report: "certificates/monolithic_certificate/residual_report_exp_vi_a.json"

  verification:
    solver_status_summary: "certificates/verification_logs/exp_vi_a_solver_status_summary.csv"
    primal_dual_residuals: "certificates/verification_logs/exp_vi_a_primal_dual_residuals.csv"
    lmi_eigenvalue_margins: "certificates/verification_logs/exp_vi_a_lmi_eigenvalue_margins.csv"
    monotonicity_report: "certificates/verification_logs/exp_vi_a_monotonicity_report.json"

  metrics:
    volume_metrics: "results/metrics/exp_vi_a_volume_metrics.csv"
    comparison_metrics: "results/metrics/exp_vi_a_dual_vs_monolithic_metrics.csv"
    runtime_summary: "results/metrics/exp_vi_a_runtime_summary.json"

  figures:
    pdf: "results/figures/fig5_gain_feasible_domain.pdf"
    tex: "results/figures/fig5_gain_feasible_domain.tex"
    png: "results/figures/fig5_gain_feasible_domain.png"


# ------------------------------------------------------------------------------
# 9. Figure generation: Fig. 5
# ------------------------------------------------------------------------------

figure:
  id: "fig5_gain_feasible_domain"
  enabled: true

  title: "3D Feasible Gain Domain under Delay Mismatch"
  caption: >
    Evolution of the 3D feasible domain of controller gains {kp, kv, ka}
    under increasing delay mismatch bounds delta_max. The feasible region
    shrinks monotonically as the uncertainty bound increases, illustrating the
    trade-off between robust stability margin and controller-gain flexibility.

  data_source: "data/processed/feasibility_grid/fig5_gain_feasible_domain.csv"

  plot_type: "3d_convex_hull"
  backend: "matplotlib"
  export_tikz: true
  export_pgfplots: true
  export_pdf: true
  export_png: true

  axes:
    x:
      variable: "kp"
      label: "$k_p$"
      limits: [0.10, 2.60]

    y:
      variable: "kv"
      label: "$k_v$"
      limits: [0.10, 3.00]

    z:
      variable: "ka"
      label: "$k_a$"
      limits: [0.00, 1.25]

  view:
    azimuth: 125
    elevation: 28

  style:
    figure_size_inches: [3.45, 3.00]
    dpi: 300
    font_family: "Times New Roman"
    font_size: 8
    grid: true

    surfaces:
      - delta_max: 0.02
        label: "$\delta_{\max}=0.02$"
        color: "#2CA02C"
        alpha: 0.23
        edge_color: "#1B7F1B"
        line_width: 0.35

      - delta_max: 0.08
        label: "$\delta_{\max}=0.08$"
        color: "#1F77B4"
        alpha: 0.35
        edge_color: "#0B4F8A"
        line_width: 0.35

      - delta_max: 0.14
        label: "$\delta_{\max}=0.14$"
        color: "#D62728"
        alpha: 0.50
        edge_color: "#8C1D18"
        line_width: 0.35

    scatter_overlay:
      enabled: false
      marker_size: 2.0
      alpha: 0.30

    legend:
      enabled: true
      location: "upper right"
      font_size: 7
      frameon: true

  pgfplots:
    enabled: true
    compat: "1.18"
    width: "0.95\\columnwidth"
    height: "0.85\\columnwidth"
    view: "{125}{28}"
    opacity_by_delta:
      "0.02": 0.23
      "0.08": 0.35
      "0.14": 0.50


# ------------------------------------------------------------------------------
# 10. Validation criteria
# ------------------------------------------------------------------------------

validation:
  enabled: true

  checks:
    grid_size:
      enabled: true
      expected_total_points: 34686
      exact_match: true

    monotonic_shrinkage:
      enabled: true
      check_by_point_inclusion: true
      check_by_volume: true
      allowed_violations: 0

    certificate_residuals:
      enabled: true
      max_primal_residual: 1.0e-6
      max_dual_residual: 1.0e-6
      min_lmi_eigenvalue: -1.0e-7

    convex_hull:
      enabled: true
      require_positive_volume: true
      minimum_vertices: 4

    output_files:
      enabled: true
      required:
        - "data/processed/feasibility_grid/fig5_gain_feasible_domain.csv"
        - "data/processed/feasibility_grid/fig5_hulls.json"
        - "results/metrics/exp_vi_a_volume_metrics.csv"
        - "results/figures/fig5_gain_feasible_domain.pdf"

  expected_behavior:
    volume_order:
      - delta_max: 0.02
        relative: "largest"
      - delta_max: 0.08
        relative: "middle"
      - delta_max: 0.14
        relative: "smallest"

    qualitative_claim: >
      The feasible 3D gain region contracts monotonically as the delay mismatch
      bound delta_max increases.


# ------------------------------------------------------------------------------
# 11. Execution profiles
# ------------------------------------------------------------------------------

profiles:
  fast:
    description: "Reduced grid for AE smoke test and quick local verification."

    override:
      grid:
        variables:
          kp:
            start: 0.50
            stop: 2.20
            num: 12
          kv:
            start: 0.60
            stop: 2.50
            num: 12
          ka:
            start: 0.30
            stop: 1.00
            num: 6

        uncertainty_slices:
          delta_max_values:
            - 0.08

        total_grid_points_expected: 864

        parallel:
          enabled: true
          n_jobs: -1

      certificates:
        evaluate_monolithic_baseline: false

      validation:
        checks:
          grid_size:
            expected_total_points: 864
          monotonic_shrinkage:
            enabled: false

      figure:
        style:
          surfaces:
            - delta_max: 0.08
              label: "$\delta_{\max}=0.08$"
              color: "#1F77B4"
              alpha: 0.40
              edge_color: "#0B4F8A"
              line_width: 0.35

  medium:
    description: "Intermediate grid for development and debugging."

    override:
      grid:
        variables:
          kp:
            start: 0.40
            stop: 2.30
            num: 25
          kv:
            start: 0.50
            stop: 2.60
            num: 27
          ka:
            start: 0.25
            stop: 1.00
            num: 10

        uncertainty_slices:
          delta_max_values:
            - 0.02
            - 0.08
            - 0.14

        total_grid_points_expected: 20250

      validation:
        checks:
          grid_size:
            expected_total_points: 20250

  plotting_only:
    description: "Regenerate Fig. 5 from processed CSV and hull files."

    override:
      execution:
        run_solver: false
        run_postprocessing: true
        run_figure_generation: true
        require_existing_processed_data: true


# ------------------------------------------------------------------------------
# 12. Runtime and reproducibility
# ------------------------------------------------------------------------------

execution:
  run_solver: true
  run_postprocessing: true
  run_validation: true
  run_figure_generation: true

  resume: true
  overwrite_existing: false
  fail_fast: true

  save_config_snapshot: true
  save_command_line: true
  save_environment_snapshot: true

  progress_bar: true
  log_level: "INFO"

  expected_runtime:
    fast_minutes: 10
    medium_minutes: 90
    full_hours: 6


reproducibility:
  random_seed: 20260816
  deterministic_order: true
  write_metadata_sidecar: true

  metadata_fields:
    - "experiment_id"
    - "config_hash"
    - "solver_config_hash"
    - "git_commit"
    - "python_version"
    - "matlab_version"
    - "solver_name"
    - "solver_version"
    - "timestamp_utc"
