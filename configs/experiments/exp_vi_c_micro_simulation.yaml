# ==============================================================================
# configs/experiments/exp_vi_c_micro_simulation.yaml
#
# Experiment VI-C:
#   Time-domain micro-simulation under stop-and-go perturbation.
#
# Paper location:
#   Section VI-C
#   Fig. 7 and Fig. 8
#
# Purpose:
#   - Simulate a mixed HDV/CAV platoon under a stop-and-go disturbance.
#   - Validate that the certified PC-SRC controller attenuates acceleration waves.
#   - Verify safety constraints: no collision and no actuator clipping.
#   - Export space-time heatmap data and time-domain trajectory profiles.
#
# Expected command:
#   python -m pcsrc.experiments.exp_vi_c_micro_simulation \
#       --config configs/experiments/exp_vi_c_micro_simulation.yaml
#
# Optional with solver/LUT regeneration:
#   python -m pcsrc.experiments.exp_vi_c_micro_simulation \
#       --config configs/experiments/exp_vi_c_micro_simulation.yaml \
#       --solver-config configs/solver/mosek.yaml \
#       --regenerate-lut
#
# Fast AE command:
#   python -m pcsrc.experiments.exp_vi_c_micro_simulation \
#       --config configs/experiments/exp_vi_c_micro_simulation.yaml \
#       --profile fast
# ==============================================================================


# ------------------------------------------------------------------------------
# 1. Experiment identity
# ------------------------------------------------------------------------------

experiment:
  id: "exp_vi_c_micro_simulation"
  name: "VI-C Stop-and-Go Micro-Simulation"
  paper_section: "VI-C"
  paper_figures:
    - "Fig. 7"
    - "Fig. 8"

  description: >
    Runs a time-domain mixed-platoon micro-simulation under a stop-and-go
    leader disturbance. The experiment evaluates wave attenuation, spacing
    safety, actuator clipping, and exports figure-ready data for heatmaps and
    time-domain profiles.

  tags:
    - "micro-simulation"
    - "stop-and-go"
    - "mixed-platoon"
    - "wave-attenuation"
    - "figure-7"
    - "figure-8"

  enabled: true
  profile_default: "full"

  dependencies:
    base_config: "configs/default.yaml"
    optional_solver_config: "configs/solver/mosek.yaml"
    lut_config: "configs/experiments/exp_vi_d_lut_deployment.yaml"
    recommended_cached_lut: "data/processed/lut/certified_gain_lut.json"


# ------------------------------------------------------------------------------
# 2. Physical system and platoon layout
# ------------------------------------------------------------------------------

physical:
  acceleration_limits:
    min: -3.0
    max: 3.0
    tolerance: 1.0e-6

  collision_boundary:
    min_spacing: 0.0
    strict_positive_spacing: true
    tolerance: 1.0e-6

  desired_safety_margin:
    min_spacing_warning: 5.0
    nominal_spacing: 22.0


traffic:
  platoon:
    num_vehicles_total: 6
    leader_index: 0
    hdv_indices: [1, 2, 3, 4]
    cav_indices: [5]
    controlled_cav_index: 5

  equilibrium:
    nominal_speed: 22.0
    nominal_spacing: 22.0
    time_headway: 1.0

  initial_conditions:
    use_equilibrium_initialization: true
    initial_speed_all: 22.0
    initial_spacing_all: 22.0
    perturb_spacing_std: 0.0
    perturb_speed_std: 0.0


# ------------------------------------------------------------------------------
# 3. HDV behavior model
# ------------------------------------------------------------------------------

hdv_model:
  type: "linearized_ovm"

  linearized:
    spacing_gain: 0.35
    relative_velocity_gain: 0.55
    velocity_gain: 0.20

  ovm:
    alpha: 0.60
    beta: 0.90
    desired_speed: 30.0
    standstill_spacing: 5.0
    transition_spacing: 20.0

  noise:
    enabled: false
    acceleration_std: 0.0
    reaction_time_std: 0.0


# ------------------------------------------------------------------------------
# 4. CAV dynamics and PC-SRC controller
# ------------------------------------------------------------------------------

cav:
  actuator:
    model: "first_order_lag_with_delay"
    nominal_tau_e: 0.35
    tau_e_min: 0.20
    tau_e_max: 0.60
    input_delay_tau_a: 0.00

    saturation:
      enabled: true
      min_acceleration: -3.0
      max_acceleration: 3.0
      report_clipping: true

  communication:
    nominal_tau_c: 0.18
    tau_c_min: 0.00
    tau_c_max: 0.40
    delay_profile: "constant"
    packet_loss_enabled: false
    packet_loss_probability: 0.0

  delay_mismatch:
    nominal_delta_max: 0.08
    uncertainty_type: "bounded_interval"

  sensor:
    radar_vision_latency: 0.03
    measurement_noise_enabled: false
    spacing_noise_std: 0.0
    relative_velocity_noise_std: 0.0
    acceleration_noise_std: 0.0


controller:
  name: "PC-SRC"
  type: "preconditioned_communication_string_robust_controller"

  source:
    mode: "fixed_gain"
    # Alternatives:
    #   fixed_gain
    #   lut
    #   regenerated_certificate
    require_certificate: true

  fixed_gain:
    kp: 1.15
    kv: 1.18
    ka: 0.61
    certificate_id: "default_nominal_pcsrc_gain"

  control_law:
    use_spacing_error: true
    use_relative_velocity: true
    use_preceding_acceleration: true

  scheduling:
    enabled: false
    source: "lut"
    interpolation: "nearest"
    fallback_policy: "nearest_feasible"

  safety_filter:
    enabled: false
    type: "none"


# ------------------------------------------------------------------------------
# 5. Time-domain simulation settings
# ------------------------------------------------------------------------------

simulation:
  scenario: "stop_and_go"

  time:
    t_start: 0.0
    t_end: 40.0
    dt_output: 0.01

  integrator:
    method: "RK45"
    rtol: 1.0e-8
    atol: 1.0e-10
    max_step: 0.01

  delay_buffer:
    interpolation: "linear"
    history_policy: "equilibrium"
    max_delay: 0.60

  leader_profile:
    type: "brake_recover_pulse"

    # The leader first brakes, then recovers, producing a stop-and-go wave.
    braking_start_time: 8.0
    braking_peak_time: 11.5
    recovery_peak_time: 20.5

    braking_amplitude: -2.3
    recovery_amplitude: 1.15

    braking_width: 2.1
    recovery_width: 2.7

    enforce_acceleration_limits: true
    min_acceleration: -3.0
    max_acceleration: 3.0

  state:
    variables:
      - "position"
      - "velocity"
      - "acceleration"
      - "spacing"
      - "relative_velocity"
      - "actuator_state"

  events:
    detect_collision: true
    detect_actuator_clipping: true
    terminate_on_collision: true
    terminate_on_nan: true


# ------------------------------------------------------------------------------
# 6. Output sampling and saved trajectories
# ------------------------------------------------------------------------------

outputs:
  root: "data/processed/simulations/exp_vi_c"

  trajectories:
    full_state: "data/processed/simulations/exp_vi_c/full_state_trajectory.csv"
    vehicle_trajectories: "data/processed/simulations/vehicle_trajectories.csv"
    acceleration_profiles: "data/processed/simulations/stop_and_go_acceleration_profiles.csv"
    spacing_profiles: "data/processed/simulations/stop_and_go_spacing_profiles.csv"
    velocity_profiles: "data/processed/simulations/exp_vi_c/velocity_profiles.csv"
    leader_profile: "data/processed/simulations/exp_vi_c/leader_profile.csv"

  heatmap:
    acceleration_space_time: "data/processed/simulations/space_time_acceleration_heatmap.csv"
    spacing_space_time: "data/processed/simulations/exp_vi_c/space_time_spacing_heatmap.csv"

  metrics:
    simulation_metrics: "results/metrics/exp_vi_c_simulation_metrics.json"
    wave_metrics: "results/metrics/exp_vi_c_wave_metrics.csv"
    safety_metrics: "results/metrics/exp_vi_c_safety_metrics.json"
    clipping_report: "results/metrics/exp_vi_c_clipping_report.csv"
    runtime_summary: "results/metrics/exp_vi_c_runtime_summary.json"

  verification:
    no_collision_report: "certificates/verification_logs/exp_vi_c_no_collision_report.json"
    no_clipping_report: "certificates/verification_logs/exp_vi_c_no_clipping_report.json"
    attenuation_report: "certificates/verification_logs/exp_vi_c_attenuation_report.json"

  figures:
    fig7_pdf: "results/figures/fig7_space_time_heatmap.pdf"
    fig7_tex: "results/figures/fig7_space_time_heatmap.tex"
    fig7_png: "results/figures/fig7_space_time_heatmap.png"

    fig8_pdf: "results/figures/fig8_time_domain_profiles.pdf"
    fig8_tex: "results/figures/fig8_time_domain_profiles.tex"
    fig8_png: "results/figures/fig8_time_domain_profiles.png"


# ------------------------------------------------------------------------------
# 7. Metrics
# ------------------------------------------------------------------------------

metrics:
  acceleration:
    compute_peak_abs: true
    compute_min_max: true
    compute_rms: true
    compute_integral_abs: true
    compute_clipping_count: true

  spacing:
    compute_min_spacing: true
    compute_collision_count: true
    compute_safety_margin: true
    compute_time_below_warning_spacing: true

  velocity:
    compute_min_max: true
    compute_rms_deviation_from_nominal: true

  wave:
    compute_hdv_amplification_ratio: true
    compute_cav_attenuation_ratio: true
    compute_vehicle_to_vehicle_peak_ratios: true
    reference_signal: "leader_acceleration"

    peak_window:
      start: 6.0
      end: 30.0

  comfort:
    compute_jerk: true
    compute_rms_jerk: true
    jerk_from_acceleration_gradient: true


# ------------------------------------------------------------------------------
# 8. Validation criteria
# ------------------------------------------------------------------------------

validation:
  enabled: true

  checks:
    simulation_completed:
      enabled: true
      require_t_end_reached: true
      t_end: 40.0
      tolerance: 1.0e-9

    no_collision:
      enabled: true
      min_spacing_strictly_greater_than: 0.0
      tolerance: 1.0e-6

    no_actuator_clipping:
      enabled: true
      acceleration_min: -3.0
      acceleration_max: 3.0
      tolerance: 1.0e-6

    finite_states:
      enabled: true
      reject_nan: true
      reject_inf: true

    wave_attenuation:
      enabled: true
      max_cav_peak_over_last_hdv_peak: 0.70
      max_cav_rms_over_last_hdv_rms: 0.80

    output_files:
      enabled: true
      required:
        - "data/processed/simulations/space_time_acceleration_heatmap.csv"
        - "data/processed/simulations/stop_and_go_acceleration_profiles.csv"
        - "data/processed/simulations/stop_and_go_spacing_profiles.csv"
        - "results/metrics/exp_vi_c_simulation_metrics.json"
        - "results/figures/fig7_space_time_heatmap.pdf"
        - "results/figures/fig8_time_domain_profiles.pdf"

  expected_behavior:
    qualitative_claim: >
      The CAV controlled by the certified PC-SRC gain attenuates the stop-and-go
      acceleration wave, maintains strictly positive spacing, and avoids actuator
      saturation clipping throughout the simulation horizon.


# ------------------------------------------------------------------------------
# 9. Figure generation: Fig. 7 and Fig. 8
# ------------------------------------------------------------------------------

figures:
  fig7:
    id: "fig7_space_time_heatmap"
    enabled: true

    title: "Space-Time Acceleration Heatmap"
    caption: >
      Space-time heatmap of acceleration responses in the mixed platoon. The
      certified CAV suppresses the stop-and-go wave as it propagates downstream.

    data_source: "data/processed/simulations/space_time_acceleration_heatmap.csv"
    plot_type: "space_time_heatmap"
    backend: "matplotlib"
    export_tikz: true
    export_pgfplots: true
    export_pdf: true
    export_png: true

    axes:
      x:
        variable: "time"
        label: "Time [s]"
        limits: [0.0, 40.0]

      y:
        variable: "vehicle_index"
        label: "Vehicle index"
        ticks: [0, 1, 2, 3, 4, 5]
        tick_labels:
          - "Leader"
          - "HDV 1"
          - "HDV 2"
          - "HDV 3"
          - "HDV 4"
          - "CAV"

    colorbar:
      variable: "acceleration"
      label: "Acceleration [m/s²]"
      limits: [-3.0, 2.0]
      cmap: "RdBu_r"

    style:
      figure_size_inches: [3.45, 2.45]
      dpi: 300
      font_family: "Times New Roman"
      font_size: 8
      interpolation: "nearest"
      grid: false

  fig8:
    id: "fig8_time_domain_profiles"
    enabled: true

    title: "Time-Domain Acceleration and Spacing Profiles"
    caption: >
      Time-domain acceleration and spacing responses. The CAV acceleration
      remains within actuator limits and the spacing trajectory stays strictly
      above the collision boundary.

    data_sources:
      acceleration: "data/processed/simulations/stop_and_go_acceleration_profiles.csv"
      spacing: "data/processed/simulations/stop_and_go_spacing_profiles.csv"

    plot_type: "stacked_time_profiles"
    backend: "matplotlib"
    export_tikz: true
    export_pgfplots: true
    export_pdf: true
    export_png: true

    layout:
      rows: 2
      cols: 1
      share_x: true

    axes:
      x:
        variable: "time"
        label: "Time [s]"
        limits: [0.0, 40.0]

      acceleration:
        variable: "acceleration"
        label: "Acceleration [m/s²]"
        limits: [-3.3, 2.2]
        show_actuator_limits: true
        actuator_limits: [-3.0, 3.0]

      spacing:
        variable: "spacing"
        label: "Spacing [m]"
        limits: [0.0, 35.0]
        show_collision_boundary: true
        collision_boundary: 0.0

    style:
      figure_size_inches: [3.45, 3.10]
      dpi: 300
      font_family: "Times New Roman"
      font_size: 8
      line_width: 1.05
      grid: true

      vehicles:
        leader:
          label: "Leader"
          color: "black"
          linestyle: "-"
        hdv1:
          label: "HDV 1"
          color: "#666666"
          linestyle: "--"
        hdv2:
          label: "HDV 2"
          color: "#D95F02"
          linestyle: "--"
        hdv3:
          label: "HDV 3"
          color: "#7570B3"
          linestyle: "--"
        hdv4:
          label: "HDV 4"
          color: "#D73027"
          linestyle: "--"
        cav:
          label: "CAV"
          color: "#1F77B4"
          linestyle: "-"

      legend:
        enabled: true
        location: "upper right"
        font_size: 7
        frameon: true


# ------------------------------------------------------------------------------
# 10. Execution profiles
# ------------------------------------------------------------------------------

profiles:
  fast:
    description: "Shorter simulation for AE smoke test."

    override:
      simulation:
        time:
          t_start: 0.0
          t_end: 25.0
          dt_output: 0.02

        integrator:
          rtol: 1.0e-7
          atol: 1.0e-9
          max_step: 0.02

      validation:
        checks:
          simulation_completed:
            t_end: 25.0
          wave_attenuation:
            enabled: false

      figures:
        fig7:
          axes:
            x:
              limits: [0.0, 25.0]
        fig8:
          axes:
            x:
              limits: [0.0, 25.0]

  noisy:
    description: "Robustness sanity check with mild measurement and HDV noise."

    override:
      hdv_model:
        noise:
          enabled: true
          acceleration_std: 0.03
          reaction_time_std: 0.02

      cav:
        sensor:
          measurement_noise_enabled: true
          spacing_noise_std: 0.02
          relative_velocity_noise_std: 0.02
          acceleration_noise_std: 0.01

      reproducibility:
        random_seed: 20260816

  plotting_only:
    description: "Regenerate Fig. 7 and Fig. 8 from processed simulation data."

    override:
      execution:
        run_simulation: false
        run_metrics: true
        run_validation: true
        run_figure_generation: true
        require_existing_processed_data: true


# ------------------------------------------------------------------------------
# 11. Runtime and reproducibility
# ------------------------------------------------------------------------------

execution:
  run_simulation: true
  run_metrics: true
  run_validation: true
  run_figure_generation: true

  resume: false
  overwrite_existing: true
  fail_fast: true

  save_config_snapshot: true
  save_command_line: true
  save_environment_snapshot: true

  progress_bar: true
  log_level: "INFO"

  expected_runtime:
    fast_minutes: 1
    full_minutes: 5


reproducibility:
  random_seed: 20260816
  deterministic_order: true
  write_metadata_sidecar: true

  metadata_fields:
    - "experiment_id"
    - "config_hash"
    - "git_commit"
    - "python_version"
    - "solver_name"
    - "solver_version"
    - "timestamp_utc"
