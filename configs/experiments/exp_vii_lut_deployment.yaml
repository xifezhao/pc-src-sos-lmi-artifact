# ==============================================================================
# configs/experiments/exp_vii_lut_deployment.yaml
#
# Experiment VII:
#   Certified gain lookup-table deployment.
#
# Paper location:
#   Section VII
#   Fig. 9
#
# Purpose:
#   - Generate a certified gain LUT over communication and actuator uncertainty.
#   - Store certificate metadata and feasibility margins for every LUT cell.
#   - Validate O(1) lookup behavior for edge-controller deployment.
#   - Export deployment metrics and architecture figure data.
#
# Expected command:
#   python -m pcsrc.experiments.exp_vii_lut_deployment \
#       --config configs/experiments/exp_vii_lut_deployment.yaml \
#       --solver-config configs/solver/mosek.yaml
#
# Fast AE command:
#   python -m pcsrc.experiments.exp_vii_lut_deployment \
#       --config configs/experiments/exp_vii_lut_deployment.yaml \
#       --solver-config configs/solver/scs_fallback.yaml \
#       --profile fast
# ==============================================================================


# ------------------------------------------------------------------------------
# 1. Experiment identity
# ------------------------------------------------------------------------------

experiment:
  id: "exp_vii_lut_deployment"
  name: "VII Certified LUT Deployment"
  paper_section: "VII"
  paper_figure: "Fig. 9"

  description: >
    Builds and validates a certified gain lookup table for deployment on an
    automotive edge controller. Each LUT entry stores a certified PC-SRC gain,
    feasibility margin, uncertainty cell metadata, and certificate provenance.
    The online controller performs constant-time lookup with deterministic
    nearest-feasible fallback.

  tags:
    - "lut"
    - "deployment"
    - "edge-controller"
    - "o1-lookup"
    - "certificate-provenance"
    - "figure-9"

  enabled: true
  profile_default: "full"

  dependencies:
    base_config: "configs/default.yaml"
    recommended_solver_config: "configs/solver/mosek.yaml"
    fallback_solver_configs:
      - "configs/solver/sdpt3.yaml"
      - "configs/solver/sedumi.yaml"
      - "configs/solver/scs_fallback.yaml"

    required_upstream_experiments:
      - "configs/experiments/exp_vi_a_feasibility_domain.yaml"
      - "configs/experiments/exp_vi_b_delay_robustness.yaml"


# ------------------------------------------------------------------------------
# 2. Deployment uncertainty domain
# ------------------------------------------------------------------------------

deployment_domain:
  dimensions:
    - "tau_c"
    - "tau_e"
    - "delta_max"

  tau_c:
    description: "Communication delay bound [s]"
    start: 0.00
    stop: 0.40
    num: 9
    scale: "linear"
    clamp_min: 0.00
    clamp_max: 0.40

  tau_e:
    description: "CAV actuator time constant [s]"
    start: 0.20
    stop: 0.60
    num: 9
    scale: "linear"
    clamp_min: 0.20
    clamp_max: 0.60

  delta_max:
    description: "Delay mismatch bound [s]"
    start: 0.00
    stop: 0.16
    num: 9
    scale: "linear"
    clamp_min: 0.00
    clamp_max: 0.16

  total_cells_expected: 729


# ------------------------------------------------------------------------------
# 3. Controller gain candidate search
# ------------------------------------------------------------------------------

controller:
  name: "PC-SRC"

  gain_bounds:
    kp:
      min: 0.10
      max: 2.60
    kv:
      min: 0.10
      max: 3.00
    ka:
      min: 0.00
      max: 1.25

  preferred_nominal_gain:
    kp: 1.15
    kv: 1.18
    ka: 0.61

  candidate_generation:
    mode: "ranked_grid_near_nominal"

    grid:
      kp:
        start: 0.35
        stop: 2.35
        num: 31

      kv:
        start: 0.40
        stop: 2.70
        num: 35

      ka:
        start: 0.20
        stop: 1.05
        num: 13

    ranking:
      objective: "nearest_to_preferred_nominal_gain"
      norm: "weighted_l2"
      weights:
        kp: 1.0
        kv: 1.0
        ka: 1.5

    fallback_candidate_policy: "maximize_feasibility_margin"


# ------------------------------------------------------------------------------
# 4. SOS-LMI certificate requirements
# ------------------------------------------------------------------------------

sos_lmi:
  formulation:
    use_dual_certificate: true
    use_monolithic_baseline: false
    robust_attenuation_certificate: true
    topology_precondition_certificate: true
    use_schur_lift: true

  polynomial:
    variables:
      - "kp"
      - "kv"
      - "ka"
      - "tau_c"
      - "tau_e"
      - "delta"

    degree:
      certificate_A: 2
      certificate_B: 2
      multipliers: 2

    basis: "monomial"
    basis_scaling: true
    remove_redundant_monomials: true

  feasibility:
    min_lmi_eigenvalue_tolerance: -1.0e-7
    max_primal_residual: 1.0e-6
    max_dual_residual: 1.0e-6
    require_solver_optimal: false

  certificate_acceptance:
    require_stage_A: true
    require_stage_B: true
    require_residual_check: true
    require_margin_record: true


# ------------------------------------------------------------------------------
# 5. LUT generation
# ------------------------------------------------------------------------------

lut:
  enabled: true

  generation:
    mode: "offline_certified_search"
    deterministic_order: true
    resume_from_partial: true
    save_after_each_cell: true

    selection_rule:
      primary: "first_feasible_ranked_candidate"
      secondary: "max_feasibility_margin"
      tie_breaker: "min_gain_norm"

    infeasible_cell_policy:
      action: "nearest_feasible_fill"
      record_original_infeasible: true
      require_distance_report: true

  dimensions:
    - "tau_c"
    - "tau_e"
    - "delta_max"

  value_fields:
    - "kp"
    - "kv"
    - "ka"
    - "feasibility_margin"
    - "certificate_id"
    - "source_cell_tau_c"
    - "source_cell_tau_e"
    - "source_cell_delta_max"

  metadata_fields:
    - "solver_name"
    - "solver_version"
    - "config_hash"
    - "certificate_hash"
    - "generation_timestamp_utc"
    - "selection_rule"
    - "residual_primal"
    - "residual_dual"
    - "min_lmi_eigenvalue"

  lookup:
    method: "nearest"
    indexing: "row_major_flat_index"
    clamp_out_of_range: true
    require_feasible_entry: true
    fallback_policy: "nearest_feasible"

    # Constant-time lookup uses precomputed strides.
    complexity_claim: "O(1)"

    strides:
      tau_c: 81
      tau_e: 9
      delta_max: 1

  integrity:
    compute_sha256: true
    verify_on_load: true
    metadata_required: true
    fail_on_hash_mismatch: true

  export:
    csv: true
    json: true
    npz: true
    c_header: false

    csv_file: "data/processed/lut/certified_gain_lut.csv"
    json_file: "data/processed/lut/certified_gain_lut.json"
    npz_file: "data/processed/lut/certified_gain_lut.npz"
    metadata_file: "data/processed/lut/lut_metadata.yaml"
    hash_file: "data/processed/lut/lut_hash.sha256"


# ------------------------------------------------------------------------------
# 6. Benchmarking and deployment validation
# ------------------------------------------------------------------------------

benchmark:
  enabled: true

  lookup_latency:
    enabled: true
    num_queries: 100000
    warmup_queries: 1000
    random_seed: 20260816

    query_distribution:
      tau_c: "uniform"
      tau_e: "uniform"
      delta_max: "uniform"

    metrics:
      - "mean_us"
      - "median_us"
      - "p95_us"
      - "p99_us"
      - "max_us"

    pass_criteria:
      mean_us_max: 100.0
      p99_us_max: 250.0

  memory_footprint:
    enabled: true
    include_values: true
    include_metadata: true
    include_hash: true

    pass_criteria:
      max_kb: 512.0

  o1_complexity_check:
    enabled: true
    method: "constant_stride_indexing_audit"
    compare_against_linear_scan: true
    size_scaling_grid:
      - [3, 3, 3]
      - [5, 5, 5]
      - [9, 9, 9]
      - [13, 13, 13]

    expected_growth: "constant_per_query_after_table_loaded"


# ------------------------------------------------------------------------------
# 7. Online controller emulation
# ------------------------------------------------------------------------------

online_emulation:
  enabled: true
  target: "automotive_edge_controller"

  inputs:
    tau_c_runtime: 0.18
    tau_e_runtime: 0.35
    delta_max_runtime: 0.08

  expected_output:
    require_feasible_gain: true
    kp_range: [0.10, 2.60]
    kv_range: [0.10, 3.00]
    ka_range: [0.00, 1.25]

  out_of_range_tests:
    enabled: true
    test_queries:
      - tau_c: -0.05
        tau_e: 0.35
        delta_max: 0.08
        expected_behavior: "clamp_tau_c_to_min"

      - tau_c: 0.18
        tau_e: 0.80
        delta_max: 0.08
        expected_behavior: "clamp_tau_e_to_max"

      - tau_c: 0.18
        tau_e: 0.35
        delta_max: 0.25
        expected_behavior: "clamp_delta_max_to_max"


# ------------------------------------------------------------------------------
# 8. Output files
# ------------------------------------------------------------------------------

outputs:
  root: "data/processed/lut"

  lut:
    csv: "data/processed/lut/certified_gain_lut.csv"
    json: "data/processed/lut/certified_gain_lut.json"
    npz: "data/processed/lut/certified_gain_lut.npz"
    metadata: "data/processed/lut/lut_metadata.yaml"
    hash: "data/processed/lut/lut_hash.sha256"

  generation:
    cell_status: "data/processed/lut/lut_cell_status.csv"
    selected_candidates: "data/processed/lut/lut_selected_candidates.csv"
    infeasible_cells: "data/processed/lut/lut_infeasible_cells.csv"
    nearest_feasible_fill_report: "data/processed/lut/lut_nearest_feasible_fill_report.csv"

  certificates:
    cell_certificate_index: "certificates/dual_certificate/lut_cell_certificate_index.csv"
    residual_report: "certificates/dual_certificate/lut_residual_report.json"
    certificate_hashes: "certificates/dual_certificate/lut_certificate_hashes.csv"

  benchmarks:
    lookup_latency: "results/metrics/exp_vii_lut_lookup_latency.csv"
    memory_footprint: "results/metrics/exp_vii_lut_memory_footprint.json"
    complexity_audit: "results/metrics/exp_vii_lut_o1_complexity_audit.csv"
    online_emulation: "results/metrics/exp_vii_lut_online_emulation.json"
    runtime_summary: "results/metrics/exp_vii_lut_runtime_summary.json"

  verification:
    integrity_report: "certificates/verification_logs/exp_vii_lut_integrity_report.json"
    hash_verification_report: "certificates/verification_logs/exp_vii_lut_hash_verification_report.json"
    lookup_validation_report: "certificates/verification_logs/exp_vii_lut_lookup_validation_report.json"
    o1_lookup_report: "certificates/verification_logs/exp_vii_lut_o1_lookup_report.json"

  figures:
    fig9_pdf: "results/figures/fig9_lut_deployment_architecture.pdf"
    fig9_tex: "results/figures/fig9_lut_deployment_architecture.tex"
    fig9_png: "results/figures/fig9_lut_deployment_architecture.png"


# ------------------------------------------------------------------------------
# 9. Figure generation: Fig. 9
# ------------------------------------------------------------------------------

figure:
  id: "fig9_lut_deployment_architecture"
  enabled: true

  title: "Certified LUT Deployment Architecture"
  caption: >
    Offline-to-online deployment architecture. SOS-LMI certificates are generated
    offline over bounded delay and actuator uncertainty. The resulting certified
    gain lookup table is hashed, exported, and loaded by the edge controller,
    where online gain selection is performed by constant-time indexed lookup.

  plot_type: "architecture_diagram"
  backend: "matplotlib"
  export_tikz: true
  export_pgfplots: false
  export_pdf: true
  export_png: true

  diagram:
    orientation: "left_to_right"

    nodes:
      - id: "offline_synthesis"
        label: "Offline SOS-LMI\nSynthesis"
        type: "process"
        color: "#A6CEE3"

      - id: "dual_certificate"
        label: "Dual Certificate\nA + B"
        type: "artifact"
        color: "#B2DF8A"

      - id: "lut_builder"
        label: "Certified LUT\nBuilder"
        type: "process"
        color: "#FDBF6F"

      - id: "hash_integrity"
        label: "SHA256\nIntegrity Check"
        type: "artifact"
        color: "#CAB2D6"

      - id: "edge_controller"
        label: "Edge Controller\nO(1) Lookup"
        type: "deployment"
        color: "#1F78B4"

      - id: "pcsrc_control"
        label: "PC-SRC\nControl Law"
        type: "process"
        color: "#FB9A99"

    edges:
      - ["offline_synthesis", "dual_certificate"]
      - ["dual_certificate", "lut_builder"]
      - ["lut_builder", "hash_integrity"]
      - ["hash_integrity", "edge_controller"]
      - ["edge_controller", "pcsrc_control"]

  style:
    figure_size_inches: [3.45, 2.20]
    dpi: 300
    font_family: "Times New Roman"
    font_size: 8
    line_width: 1.0
    arrow_style: "->"
    node_padding: 0.15


# ------------------------------------------------------------------------------
# 10. Validation criteria
# ------------------------------------------------------------------------------

validation:
  enabled: true

  checks:
    lut_cell_count:
      enabled: true
      expected_total_cells: 729
      exact_match: true

    all_entries_feasible_or_filled:
      enabled: true
      require_no_empty_cells: true
      require_source_cell_record: true

    certificate_residuals:
      enabled: true
      max_primal_residual: 1.0e-6
      max_dual_residual: 1.0e-6
      min_lmi_eigenvalue: -1.0e-7

    hash_integrity:
      enabled: true
      require_sha256_file: true
      verify_on_load: true

    lookup_complexity:
      enabled: true
      expected_complexity: "O(1)"
      max_average_lookup_time_microseconds: 100.0

    memory_footprint:
      enabled: true
      max_kb: 512.0

    output_files:
      enabled: true
      required:
        - "data/processed/lut/certified_gain_lut.csv"
        - "data/processed/lut/certified_gain_lut.json"
        - "data/processed/lut/lut_metadata.yaml"
        - "data/processed/lut/lut_hash.sha256"
        - "results/metrics/exp_vii_lut_lookup_latency.csv"
        - "results/figures/fig9_lut_deployment_architecture.pdf"

  expected_behavior:
    qualitative_claim: >
      The generated LUT provides certified feasible PC-SRC gains for the bounded
      deployment uncertainty grid, supports deterministic constant-time lookup,
      fits within the configured edge-controller memory budget, and passes
      SHA256 integrity verification.


# ------------------------------------------------------------------------------
# 11. Execution profiles
# ------------------------------------------------------------------------------

profiles:
  fast:
    description: "Small LUT for AE smoke testing and license-free fallback checks."

    override:
      deployment_domain:
        tau_c:
          start: 0.00
          stop: 0.40
          num: 3
        tau_e:
          start: 0.20
          stop: 0.60
          num: 3
        delta_max:
          start: 0.00
          stop: 0.16
          num: 3
        total_cells_expected: 27

      controller:
        candidate_generation:
          grid:
            kp:
              start: 0.70
              stop: 1.70
              num: 5
            kv:
              start: 0.80
              stop: 1.80
              num: 5
            ka:
              start: 0.40
              stop: 0.90
              num: 4

      lut:
        lookup:
          strides:
            tau_c: 9
            tau_e: 3
            delta_max: 1

      benchmark:
        lookup_latency:
          num_queries: 10000
          warmup_queries: 500

      validation:
        checks:
          lut_cell_count:
            expected_total_cells: 27
          certificate_residuals:
            max_primal_residual: 5.0e-4
            max_dual_residual: 5.0e-4
            min_lmi_eigenvalue: -5.0e-5

  medium:
    description: "Intermediate LUT for debugging deployment metrics."

    override:
      deployment_domain:
        tau_c:
          start: 0.00
          stop: 0.40
          num: 5
        tau_e:
          start: 0.20
          stop: 0.60
          num: 5
        delta_max:
          start: 0.00
          stop: 0.16
          num: 5
        total_cells_expected: 125

      lut:
        lookup:
          strides:
            tau_c: 25
            tau_e: 5
            delta_max: 1

      validation:
        checks:
          lut_cell_count:
            expected_total_cells: 125

  benchmark_only:
    description: "Benchmark lookup and memory from an existing LUT."

    override:
      execution:
        run_lut_generation: false
        run_benchmark: true
        run_validation: true
        run_figure_generation: false
        require_existing_lut: true

  plotting_only:
    description: "Regenerate Fig. 9 from architecture configuration."

    override:
      execution:
        run_lut_generation: false
        run_benchmark: false
        run_validation: false
        run_figure_generation: true
        require_existing_lut: false


# ------------------------------------------------------------------------------
# 12. Runtime and reproducibility
# ------------------------------------------------------------------------------

execution:
  run_lut_generation: true
  run_benchmark: true
  run_validation: true
  run_figure_generation: true

  resume: true
  overwrite_existing: false
  fail_fast: true

  save_config_snapshot: true
  save_command_line: true
  save_environment_snapshot: true

  progress_bar: true
  log_level: "INFO"

  expected_runtime:
    fast_minutes: 15
    medium_minutes: 90
    full_hours: 4


reproducibility:
  random_seed: 20260816
  deterministic_order: true
  write_metadata_sidecar: true

  metadata_fields:
    - "experiment_id"
    - "config_hash"
    - "solver_config_hash"
    - "git_commit"
    - "python_version"
    - "solver_name"
    - "solver_version"
    - "lut_hash"
    - "timestamp_utc"
