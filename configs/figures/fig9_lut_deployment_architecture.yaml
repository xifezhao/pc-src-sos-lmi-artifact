# ==============================================================================
# configs/figures/fig9_lut_deployment_architecture.yaml
#
# Figure 9:
#   Certified LUT deployment architecture.
#
# Purpose:
#   - Render the offline-to-online certified LUT deployment pipeline.
#   - Show SOS-LMI synthesis, dual-certificate verification, LUT construction,
#     integrity hashing, edge-controller loading, and O(1) gain lookup.
#   - Optionally annotate runtime metrics such as memory footprint and lookup
#     latency from Experiment VII.
#
# Upstream experiment:
#   configs/experiments/exp_vii_lut_deployment.yaml
#
# Expected command:
#   python -m pcsrc.figures.fig9_lut_deployment_architecture \
#       --config configs/figures/fig9_lut_deployment_architecture.yaml
#
# Alternative:
#   python scripts/make_figures.py --figure fig9
# ==============================================================================


# ------------------------------------------------------------------------------
# 1. Figure identity
# ------------------------------------------------------------------------------

figure:
  id: "fig9_lut_deployment_architecture"
  number: 9
  name: "Certified LUT Deployment Architecture"
  paper_section: "VII"

  description: >
    Architecture diagram for certified LUT deployment. Offline SOS-LMI synthesis
    generates certified controller gains over bounded communication-delay,
    actuator, and mismatch uncertainty cells. The LUT is exported with certificate
    provenance and SHA256 integrity metadata, then loaded by the online edge
    controller for deterministic constant-time gain lookup.

  upstream_experiment:
    id: "exp_vii_lut_deployment"
    config: "configs/experiments/exp_vii_lut_deployment.yaml"

  enabled: true


# ------------------------------------------------------------------------------
# 2. Optional input data
# ------------------------------------------------------------------------------

inputs:
  optional:
    lut_metadata_yaml: "data/processed/lut/lut_metadata.yaml"
    lut_hash_file: "data/processed/lut/lut_hash.sha256"
    lookup_latency_csv: "results/metrics/exp_vii_lut_lookup_latency.csv"
    memory_footprint_json: "results/metrics/exp_vii_lut_memory_footprint.json"
    online_emulation_json: "results/metrics/exp_vii_lut_online_emulation.json"
    integrity_report_json: "certificates/verification_logs/exp_vii_lut_integrity_report.json"

  validation:
    require_optional_inputs_for_metric_annotations: false
    require_nonempty_if_present: true


# ------------------------------------------------------------------------------
# 3. Output files
# ------------------------------------------------------------------------------

outputs:
  pdf: "results/figures/fig9_lut_deployment_architecture.pdf"
  tex: "results/figures/fig9_lut_deployment_architecture.tex"
  pgf: "results/figures/fig9_lut_deployment_architecture.pgf"
  png: "results/figures/fig9_lut_deployment_architecture.png"

  data_exports:
    node_layout_csv: "results/figures/fig9_lut_deployment_nodes.csv"
    edge_layout_csv: "results/figures/fig9_lut_deployment_edges.csv"
    plotted_summary_yaml: "results/figures/fig9_lut_deployment_summary.yaml"

  metadata: "results/figures/fig9_lut_deployment_architecture_metadata.yaml"


# ------------------------------------------------------------------------------
# 4. Plot type and rendering backend
# ------------------------------------------------------------------------------

rendering:
  backend: "matplotlib"
  plot_type: "architecture_diagram"

  export:
    pdf: true
    tex: true
    pgf: false
    png: true

  tikz:
    enabled: true
    library: "tikzplotlib"
    standalone: false
    strict: false
    axis_width: "\\columnwidth"
    axis_height: "0.64\\columnwidth"

  pgfplots:
    enabled: false

  raster_preview:
    enabled: true
    dpi: 300


# ------------------------------------------------------------------------------
# 5. Canvas and diagram layout
# ------------------------------------------------------------------------------

canvas:
  figure_size_inches: [3.45, 2.20]
  dpi: 300
  background_color: "white"

  axes:
    visible: false
    xlim: [0.0, 10.0]
    ylim: [0.0, 4.0]
    equal_aspect: false

  margins:
    left: 0.02
    right: 0.98
    bottom: 0.06
    top: 0.94


diagram:
  orientation: "left_to_right"

  lanes:
    enabled: true

    offline:
      label: "Offline certification"
      y_range: [2.15, 3.75]
      face_color: "#F4F8FB"
      edge_color: "#D6E4EF"
      alpha: 1.0

    deployment_artifact:
      label: "Deployment artifact"
      y_range: [1.10, 2.05]
      face_color: "#FFF8EE"
      edge_color: "#F2D6A2"
      alpha: 1.0

    online:
      label: "Online controller"
      y_range: [0.25, 1.00]
      face_color: "#F3F7F0"
      edge_color: "#D8E8CE"
      alpha: 1.0

  layout:
    coordinate_system: "manual"
    node_anchor: "center"

    nodes:
      offline_synthesis: [1.00, 2.95]
      dual_certificate: [2.70, 2.95]
      lut_builder: [4.35, 2.95]
      lut_artifact: [5.95, 1.58]
      hash_integrity: [7.45, 1.58]
      edge_controller: [8.85, 0.63]
      pcsrc_control: [5.95, 0.63]

    routing:
      style: "orthogonal"
      arrow_direction: "forward"


# ------------------------------------------------------------------------------
# 6. Nodes
# ------------------------------------------------------------------------------

nodes:
  offline_synthesis:
    label: "Offline\nSOS-LMI\nsynthesis"
    type: "process"
    lane: "offline"
    icon: "solver"
    width: 1.25
    height: 0.72
    face_color: "#A6CEE3"
    edge_color: "#1F77B4"
    text_color: "#111111"

  dual_certificate:
    label: "Dual certificate\nA + B"
    type: "certificate"
    lane: "offline"
    icon: "check"
    width: 1.25
    height: 0.72
    face_color: "#B2DF8A"
    edge_color: "#33A02C"
    text_color: "#111111"

  lut_builder:
    label: "Certified\nLUT builder"
    type: "process"
    lane: "offline"
    icon: "table"
    width: 1.25
    height: 0.72
    face_color: "#FDBF6F"
    edge_color: "#D95F02"
    text_color: "#111111"

  lut_artifact:
    label: "Gain LUT\n+ margins\n+ provenance"
    type: "artifact"
    lane: "deployment_artifact"
    icon: "database"
    width: 1.35
    height: 0.78
    face_color: "#FFF2CC"
    edge_color: "#B8860B"
    text_color: "#111111"

  hash_integrity:
    label: "SHA256\nintegrity\ncheck"
    type: "artifact"
    lane: "deployment_artifact"
    icon: "hash"
    width: 1.22
    height: 0.78
    face_color: "#CAB2D6"
    edge_color: "#6A3D9A"
    text_color: "#111111"

  edge_controller:
    label: "Edge controller\nO(1) lookup"
    type: "deployment"
    lane: "online"
    icon: "ecu"
    width: 1.35
    height: 0.68
    face_color: "#1F78B4"
    edge_color: "#0B4F8A"
    text_color: "white"

  pcsrc_control:
    label: "PC-SRC\ncontrol law"
    type: "process"
    lane: "online"
    icon: "controller"
    width: 1.25
    height: 0.68
    face_color: "#FB9A99"
    edge_color: "#E31A1C"
    text_color: "#111111"


# ------------------------------------------------------------------------------
# 7. Edges
# ------------------------------------------------------------------------------

edges:
  - id: "synthesis_to_certificate"
    source: "offline_synthesis"
    target: "dual_certificate"
    label: "SOS-LMI\nfeasibility"
    style: "solid"
    color: "#333333"
    linewidth: 0.85
    arrowstyle: "->"

  - id: "certificate_to_builder"
    source: "dual_certificate"
    target: "lut_builder"
    label: "certified\ngains"
    style: "solid"
    color: "#333333"
    linewidth: 0.85
    arrowstyle: "->"

  - id: "builder_to_lut"
    source: "lut_builder"
    target: "lut_artifact"
    label: "export"
    style: "solid"
    color: "#333333"
    linewidth: 0.85
    arrowstyle: "->"
    route:
      - [4.35, 2.55]
      - [5.95, 2.10]
      - [5.95, 1.98]

  - id: "lut_to_hash"
    source: "lut_artifact"
    target: "hash_integrity"
    label: "hash"
    style: "solid"
    color: "#333333"
    linewidth: 0.85
    arrowstyle: "->"

  - id: "hash_to_edge"
    source: "hash_integrity"
    target: "edge_controller"
    label: "verified\nload"
    style: "solid"
    color: "#333333"
    linewidth: 0.85
    arrowstyle: "->"
    route:
      - [7.45, 1.18]
      - [8.85, 1.05]
      - [8.85, 0.98]

  - id: "edge_to_pcsrc"
    source: "edge_controller"
    target: "pcsrc_control"
    label: "$k_p,k_v,k_a$"
    style: "solid"
    color: "#333333"
    linewidth: 0.85
    arrowstyle: "->"

  - id: "runtime_uncertainty_to_edge"
    source_virtual: [8.85, 1.42]
    target: "edge_controller"
    label: "$\\tau_c,\\tau_e,\\delta_{\\max}$"
    style: "dashed"
    color: "#555555"
    linewidth: 0.75
    arrowstyle: "->"


# ------------------------------------------------------------------------------
# 8. Text callouts and metric annotations
# ------------------------------------------------------------------------------

callouts:
  enabled: true

  offline_note:
    enabled: true
    text: "Offline cost only"
    xy: [2.70, 3.62]
    ha: "center"
    va: "center"
    color: "#444444"

  online_note:
    enabled: true
    text: "Runtime: indexed lookup"
    xy: [7.30, 0.23]
    ha: "center"
    va: "center"
    color: "#444444"

  certificate_note:
    enabled: false
    text: "Each LUT cell stores certificate provenance"
    xy: [4.90, 2.28]
    ha: "center"
    va: "center"
    color: "#444444"


metric_annotations:
  enabled: true
  source: "optional_inputs_if_available"

  lookup_latency:
    enabled: true
    input: "results/metrics/exp_vii_lut_lookup_latency.csv"
    field: "mean_us"
    fallback_text: "mean lookup < 100 μs"
    text_template: "mean lookup: {mean_us:.1f} μs"
    xy: [8.85, 0.08]
    ha: "center"
    va: "center"

  memory_footprint:
    enabled: true
    input: "results/metrics/exp_vii_lut_memory_footprint.json"
    field: "total_kb"
    fallback_text: "LUT < 512 KB"
    text_template: "memory: {total_kb:.0f} KB"
    xy: [5.95, 1.02]
    ha: "center"
    va: "center"

  hash_status:
    enabled: false
    input: "certificates/verification_logs/exp_vii_lut_integrity_report.json"
    field: "hash_verified"
    fallback_text: "hash verified"
    text_template: "hash verified: {hash_verified}"
    xy: [7.45, 1.02]
    ha: "center"
    va: "center"


# ------------------------------------------------------------------------------
# 9. Visual styling
# ------------------------------------------------------------------------------

style:
  font:
    family: "Times New Roman"
    math_font: "stix"
    size: 8
    node_size: 7
    edge_label_size: 6
    lane_label_size: 7
    callout_size: 6

  nodes:
    rounded: true
    rounding_size: 0.08
    linewidth: 0.90
    alpha: 1.0
    shadow:
      enabled: false
      offset: [0.03, -0.03]
      alpha: 0.20

  edges:
    connectionstyle: "arc3,rad=0.0"
    shrinkA: 4
    shrinkB: 4
    mutation_scale: 8
    label_offset: [0.0, 0.10]
    label_bbox:
      enabled: true
      facecolor: "white"
      edgecolor: "none"
      alpha: 0.75
      pad: 0.10

  lanes:
    label_position: "left"
    label_rotation: 90
    linewidth: 0.60
    linestyle: "-"
    label_color: "#555555"

  title:
    enabled: false
    text: "Certified LUT Deployment"


# ------------------------------------------------------------------------------
# 10. Data export for reproducibility
# ------------------------------------------------------------------------------

data_export:
  enabled: true

  node_layout:
    file: "results/figures/fig9_lut_deployment_nodes.csv"
    include_fields:
      - "id"
      - "label"
      - "type"
      - "lane"
      - "x"
      - "y"
      - "width"
      - "height"

  edge_layout:
    file: "results/figures/fig9_lut_deployment_edges.csv"
    include_fields:
      - "id"
      - "source"
      - "target"
      - "label"
      - "style"

  summary:
    file: "results/figures/fig9_lut_deployment_summary.yaml"
    include_metric_annotations: true
    include_optional_input_hashes: true


# ------------------------------------------------------------------------------
# 11. Figure validation
# ------------------------------------------------------------------------------

validation:
  enabled: true

  checks:
    required_nodes:
      enabled: true
      ids:
        - "offline_synthesis"
        - "dual_certificate"
        - "lut_builder"
        - "lut_artifact"
        - "hash_integrity"
        - "edge_controller"
        - "pcsrc_control"

    required_edges:
      enabled: true
      ids:
        - "synthesis_to_certificate"
        - "certificate_to_builder"
        - "builder_to_lut"
        - "lut_to_hash"
        - "hash_to_edge"
        - "edge_to_pcsrc"

    node_positions:
      enabled: true
      require_within_canvas: true
      min_separation: 0.35

    optional_inputs:
      enabled: true
      fail_if_missing: false
      validate_if_present: true

    output_files:
      enabled: true
      required:
        - "results/figures/fig9_lut_deployment_architecture.pdf"
        - "results/figures/fig9_lut_deployment_architecture.tex"

  tolerances:
    node_position: 1.0e-9
    canvas_bounds: 1.0e-9


# ------------------------------------------------------------------------------
# 12. Reproducibility metadata
# ------------------------------------------------------------------------------

metadata:
  write: true
  include:
    - "figure_id"
    - "optional_input_file_hashes"
    - "config_hash"
    - "git_commit"
    - "python_version"
    - "matplotlib_version"
    - "tikzplotlib_version"
    - "timestamp_utc"

  notes: >
    This figure is an architecture diagram generated from configuration. Optional
    benchmark and integrity files from Experiment VII may be used for annotations,
    but the diagram can be rendered without running LUT generation.
