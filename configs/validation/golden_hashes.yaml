      required: true

    experiment_vii_lut_deployment:
      path: "configs/experiments/exp_vii_lut_deployment.yaml"
      sha256: "TO_BE_GENERATED_EXP_VII_LUT_DEPLOYMENT_SHA256"
      required: true

    figure_fig5_gain_feasible_domain:
      path: "configs/figures/fig5_gain_feasible_domain.yaml"
      sha256: "TO_BE_GENERATED_FIG5_CONFIG_SHA256"
      required: true

    figure_fig6_structural_conservatism:
      path: "configs/figures/fig6_structural_conservatism.yaml"
      sha256: "TO_BE_GENERATED_FIG6_CONFIG_SHA256"
      required: true

    figure_fig7_space_time_heatmap:
      path: "configs/figures/fig7_space_time_heatmap.yaml"
      sha256: "TO_BE_GENERATED_FIG7_CONFIG_SHA256"
      required: true

    figure_fig8_time_domain_profiles:
      path: "configs/figures/fig8_time_domain_profiles.yaml"
      sha256: "TO_BE_GENERATED_FIG8_CONFIG_SHA256"
      required: true

    figure_fig9_lut_deployment_architecture:
      path: "configs/figures/fig9_lut_deployment_architecture.yaml"
      sha256: "TO_BE_GENERATED_FIG9_CONFIG_SHA256"
      required: true

    validation_tolerances:
      path: "configs/validation/tolerances.yaml"
      sha256: "TO_BE_GENERATED_VALIDATION_TOLERANCES_SHA256"
      required: true

    validation_golden_hashes:
      path: "configs/validation/golden_hashes.yaml"
      sha256: "TO_BE_GENERATED_VALIDATION_GOLDEN_HASHES_SHA256"
      required: true
      self_hash_policy: "exclude_own_sha256_field"


# ------------------------------------------------------------------------------
# 4. Processed data hashes
# ------------------------------------------------------------------------------

processed_data:
  mode: "numeric_csv"

  files:
    fig5_gain_feasible_domain_csv:
      path: "data/processed/feasibility_grid/fig5_gain_feasible_domain.csv"
      sha256: "TO_BE_GENERATED_FIG5_DATA_SHA256"
      required: true
      schema:
        columns:
          - "kp"
          - "kv"
          - "ka"
          - "delta_max"
          - "certificate_type"
          - "feasible"
      semantic:
        key_columns: ["delta_max", "kp", "kv", "ka", "certificate_type"]
        min_rows: 1

    fig6_ka08_slice_csv:
      path: "data/processed/feasibility_grid/fig6_ka08_slice.csv"
      sha256: "TO_BE_GENERATED_FIG6_DATA_SHA256"
      required: true
      schema:
        columns:
          - "kp"
          - "kv"
          - "ka"
          - "tau_c"
          - "tau_e"
          - "delta_max"
          - "dual_feasible"
          - "monolithic_feasible"
      semantic:
        key_columns: ["kp", "kv"]
        expected_fixed_values:
          ka: 0.80
          tau_c: 0.18
          tau_e: 0.35
          delta_max: 0.08
        min_rows: 1

    stop_and_go_acceleration_profiles_csv:
      path: "data/processed/simulations/stop_and_go_acceleration_profiles.csv"
      sha256: "TO_BE_GENERATED_STOP_AND_GO_ACCELERATION_SHA256"
      required: true
      schema:
        columns:
          - "time"
          - "vehicle_index"
          - "acceleration"
      semantic:
        key_columns: ["vehicle_index", "time"]
        vehicle_indices: [0, 1, 2, 3, 4, 5]
        time_range: [0.0, 40.0]
        min_rows: 1

    stop_and_go_spacing_profiles_csv:
      path: "data/processed/simulations/stop_and_go_spacing_profiles.csv"
      sha256: "TO_BE_GENERATED_STOP_AND_GO_SPACING_SHA256"
      required: true
      schema:
        columns:
          - "time"
          - "vehicle_index"
          - "spacing"
      semantic:
        key_columns: ["vehicle_index", "time"]
        vehicle_indices: [1, 2, 3, 4, 5]
        time_range: [0.0, 40.0]
        spacing_min_strictly_greater_than: 0.0
        min_rows: 1

    space_time_acceleration_heatmap_csv:
      path: "data/processed/simulations/space_time_acceleration_heatmap.csv"
      sha256: "TO_BE_GENERATED_SPACE_TIME_ACCELERATION_HEATMAP_SHA256"
      required: true
      schema:
        columns:
          - "time"
          - "vehicle_index"
          - "acceleration"
      semantic:
        key_columns: ["vehicle_index", "time"]
        vehicle_indices: [0, 1, 2, 3, 4, 5]
        require_rectangular_grid: true
        min_rows: 1

    certified_gain_lut_csv:
      path: "data/processed/lut/certified_gain_lut.csv"
      sha256: "TO_BE_GENERATED_CERTIFIED_GAIN_LUT_CSV_SHA256"
      required: true
      schema:
        columns:
          - "tau_c"
          - "tau_e"
          - "delta_max"
          - "kp"
          - "kv"
          - "ka"
          - "feasibility_margin"
          - "certificate_id"
      semantic:
        key_columns: ["tau_c", "tau_e", "delta_max"]
        expected_rows: 729
        require_no_empty_cells: true


# ------------------------------------------------------------------------------
# 5. JSON / YAML artifact hashes
# ------------------------------------------------------------------------------

structured_artifacts:
  mode: "strict"

  files:
    fig5_hulls_json:
      path: "data/processed/feasibility_grid/fig5_hulls.json"
      sha256: "TO_BE_GENERATED_FIG5_HULLS_JSON_SHA256"
      required: true
      fallback_mode: "numeric_csv"

    fig6_contours_json:
      path: "data/processed/feasibility_grid/fig6_contours.json"
      sha256: "TO_BE_GENERATED_FIG6_CONTOURS_JSON_SHA256"
      required: true
      fallback_mode: "numeric_csv"

    lut_metadata_yaml:
      path: "data/processed/lut/lut_metadata.yaml"
      sha256: "TO_BE_GENERATED_LUT_METADATA_YAML_SHA256"
      required: true

    lut_hash_sha256:
      path: "data/processed/lut/lut_hash.sha256"
      sha256: "TO_BE_GENERATED_LUT_HASH_FILE_SHA256"
      required: true

    exp_vi_c_stop_and_go_scenario_metadata:
      path: "data/processed/simulations/exp_vi_c_stop_and_go/scenario_metadata.yaml"
      sha256: "TO_BE_GENERATED_STOP_AND_GO_SCENARIO_METADATA_SHA256"
      required: false


# ------------------------------------------------------------------------------
# 6. Solver certificate hashes
# ------------------------------------------------------------------------------

certificates:
  mode: "solver_artifact"

  files:
    dual_certificate_A_topology_precondition:
      path: "certificates/dual_certificate/certificate_A_topology_precondition.json"
      sha256: "TO_BE_GENERATED_CERTIFICATE_A_TOPOLOGY_SHA256"
      required: true
      semantic:
        require_certificate_type: "topology_precondition_certificate"
        max_primal_residual: 1.0e-6
        max_dual_residual: 1.0e-6
        min_lmi_eigenvalue: -1.0e-7

    dual_certificate_B_schur_robustness:
      path: "certificates/dual_certificate/certificate_B_schur_robustness.json"
      sha256: "TO_BE_GENERATED_CERTIFICATE_B_SCHUR_SHA256"
      required: true
      semantic:
        require_certificate_type: "schur_robustness_certificate"
        max_primal_residual: 1.0e-6
        max_dual_residual: 1.0e-6
        min_lmi_eigenvalue: -1.0e-7

    exp_vi_a_dual_residual_report:
      path: "certificates/dual_certificate/residual_report_exp_vi_a.json"
      sha256: "TO_BE_GENERATED_EXP_VI_A_DUAL_RESIDUAL_REPORT_SHA256"
      required: true
      semantic:
        max_primal_residual: 1.0e-6
        max_dual_residual: 1.0e-6

    exp_vi_b_dual_residual_report:
      path: "certificates/dual_certificate/residual_report_exp_vi_b.json"
      sha256: "TO_BE_GENERATED_EXP_VI_B_DUAL_RESIDUAL_REPORT_SHA256"
      required: true
      semantic:
        max_primal_residual: 1.0e-6
        max_dual_residual: 1.0e-6

    lut_cell_certificate_index:
      path: "certificates/dual_certificate/lut_cell_certificate_index.csv"
      sha256: "TO_BE_GENERATED_LUT_CELL_CERTIFICATE_INDEX_SHA256"
      required: true
      fallback_mode: "numeric_csv"
      semantic:
        expected_rows: 729
        require_no_empty_cells: true


# ------------------------------------------------------------------------------
# 7. Metrics hashes
# ------------------------------------------------------------------------------

metrics:
  mode: "numeric_csv"

  files:
    exp_vi_a_volume_metrics:
      path: "results/metrics/exp_vi_a_volume_metrics.csv"
      sha256: "TO_BE_GENERATED_EXP_VI_A_VOLUME_METRICS_SHA256"
      required: true
      schema:
        columns:
          - "delta_max"
          - "certificate_type"
          - "feasible_volume"

    exp_vi_b_area_metrics:
      path: "results/metrics/exp_vi_b_area_metrics.csv"
      sha256: "TO_BE_GENERATED_EXP_VI_B_AREA_METRICS_SHA256"
      required: true
      schema:
        columns:
          - "method"
          - "area"
          - "area_ratio"

    exp_vi_c_stop_and_go_wave_metrics:
      path: "results/metrics/exp_vi_c_stop_and_go_wave_metrics.csv"
      sha256: "TO_BE_GENERATED_EXP_VI_C_WAVE_METRICS_SHA256"
      required: true
      schema:
        columns:
          - "vehicle_index"
          - "peak_abs_acceleration"
          - "rms_acceleration"

    exp_vii_lut_lookup_latency:
      path: "results/metrics/exp_vii_lut_lookup_latency.csv"
      sha256: "TO_BE_GENERATED_EXP_VII_LUT_LOOKUP_LATENCY_SHA256"
      required: true
      schema:
        columns:
          - "metric"
          - "value_us"
      semantic:
        max_mean_us: 100.0
        max_p99_us: 250.0

    exp_vii_lut_memory_footprint:
      path: "results/metrics/exp_vii_lut_memory_footprint.json"
      sha256: "TO_BE_GENERATED_EXP_VII_LUT_MEMORY_FOOTPRINT_SHA256"
      required: true
      fallback_mode: "strict"
      semantic:
        max_total_kb: 512.0


# ------------------------------------------------------------------------------
# 8. LUT binary hashes
# ------------------------------------------------------------------------------

binary_artifacts:
  mode: "binary_array"

  files:
    certified_gain_lut_npz:
      path: "data/processed/lut/certified_gain_lut.npz"
      sha256: "TO_BE_GENERATED_CERTIFIED_GAIN_LUT_NPZ_SHA256"
      required: true
      semantic:
        arrays:
          gains:
            shape: [9, 9, 9, 3]
            dtype: "float64"
          feasibility_margin:
            shape: [9, 9, 9]
            dtype: "float64"
          feasible:
            shape: [9, 9, 9]
            dtype: "bool"

    certified_gain_lut_json:
      path: "data/processed/lut/certified_gain_lut.json"
      sha256: "TO_BE_GENERATED_CERTIFIED_GAIN_LUT_JSON_SHA256"
      required: true
      fallback_mode: "strict"


