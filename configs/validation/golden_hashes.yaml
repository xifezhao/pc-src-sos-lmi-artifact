# ==============================================================================
# configs/validation/golden_hashes.yaml
#
# Golden reference hashes for reproducibility validation.
#
# Purpose:
#   - Record canonical SHA256 hashes for source configs, processed datasets,
#     certificates, LUT artifacts, metrics, and generated figures.
#   - Support strict byte-level validation for deterministic artifacts.
#   - Support semantic validation fallback for solver- or platform-dependent files.
#   - Provide a single registry consumed by validation and CI scripts.
#
# Usage examples:
#   python -m pcsrc.validation.check_hashes \
#       --hash-config configs/validation/golden_hashes.yaml
#
#   python -m pcsrc.validation.run_checks \
#       --tolerances configs/validation/tolerances.yaml \
#       --golden-hashes configs/validation/golden_hashes.yaml
#
# Notes:
#   - Placeholder hashes beginning with "TO_BE_GENERATED_" should be replaced by
#     release hashes after running the canonical reproduction pipeline.
#   - Config/source files are expected to be byte-stable.
#   - Solver outputs may require semantic validation if generated on another
#     platform or with another SDP solver.
# ==============================================================================


# ------------------------------------------------------------------------------
# 1. Metadata
# ------------------------------------------------------------------------------

metadata:
  id: "pcsrc_golden_hashes"
  version: "1.0.0"

  description: >
    Golden SHA256 registry for PC-SRC reproducibility artifacts, including YAML
    configs, processed experiment outputs, SOS-LMI certificates, LUT deployment
    files, metrics, and generated figures.

  hash_algorithm: "sha256"
  digest_length: 64
  encoding: "utf-8"
  line_ending_policy: "lf"
  path_root: "repository_root"

  generated_by:
    command: >
      python -m pcsrc.validation.generate_golden_hashes
      --config configs/validation/golden_hashes.yaml
    canonical_profile: "paper"
    canonical_solver: "mosek"
    canonical_tolerances: "configs/validation/tolerances.yaml"

  created_utc: "TO_BE_GENERATED_TIMESTAMP_UTC"
  git_commit: "TO_BE_GENERATED_GIT_COMMIT"
  release_tag: "TO_BE_GENERATED_RELEASE_TAG"

  validation_policy:
    default_mode: "strict"
    allow_placeholder_hashes: true
    fail_on_missing_nonoptional: true
    fail_on_hash_mismatch: true
    semantic_fallback_enabled: true


# ------------------------------------------------------------------------------
# 2. Hash modes
# ------------------------------------------------------------------------------

hash_modes:
  strict:
    description: >
      Byte-for-byte SHA256 hash must match exactly. Recommended for source YAML,
      scripts, manually curated metadata, and deterministic JSON/YAML artifacts.
    require_exact_sha256: true
    allow_semantic_fallback: false

  normalized_text:
    description: >
      Normalize line endings to LF and strip trailing whitespace before hashing.
      Useful for text exports that may be touched by cross-platform tooling.
    normalize_line_endings: true
    strip_trailing_whitespace: true
    require_exact_sha256: true
    allow_semantic_fallback: false

  numeric_csv:
    description: >
      Validate CSV content by schema, row count, sorted key columns, and numeric
      tolerances. Byte hash is recorded when available but semantic fallback is
      permitted across platforms.
    require_exact_sha256: false
    allow_semantic_fallback: true
    semantic_checks:
      schema: true
      row_count: true
      numeric_tolerance_profile: "default"
      sort_before_compare: true

  solver_artifact:
    description: >
      Solver-generated certificate or residual artifact. Exact hash is preferred
      for canonical reproduction, but semantic validation is allowed because SDP
      solvers and BLAS libraries may produce platform-specific formatting.
    require_exact_sha256: false
    allow_semantic_fallback: true
    semantic_checks:
      residual_thresholds: true
      eigenvalue_thresholds: true
      certificate_metadata: true

  figure_vector:
    description: >
      PDF/TEX/PGF output generated by plotting libraries. Exact hash may vary due
      to timestamps, font embedding, or backend metadata. Semantic/file checks
      are used unless canonical byte-level export is enabled.
    require_exact_sha256: false
    allow_semantic_fallback: true
    semantic_checks:
      file_exists: true
      min_file_size: true
      optional_visual_regression: false

  binary_array:
    description: >
      Binary NPZ or NumPy array artifact. Exact hash is preferred, but semantic
      validation can compare array names, shapes, dtypes, and numeric values.
    require_exact_sha256: false
    allow_semantic_fallback: true
    semantic_checks:
      array_names: true
      shapes: true
      dtypes: true
      numeric_tolerance_profile: "default"


# ------------------------------------------------------------------------------
# 3. Source configuration hashes
# ------------------------------------------------------------------------------

source_configs:
  mode: "strict"

  files:
    configs_default:
      path: "configs/default.yaml"
      sha256: "TO_BE_GENERATED_CONFIGS_DEFAULT_SHA256"
      required: true

    solver_mosek:
      path: "configs/solver/mosek.yaml"
      sha256: "TO_BE_GENERATED_SOLVER_MOSEK_SHA256"
      required: true

    solver_scs_fallback:
      path: "configs/solver/scs_fallback.yaml"
      sha256: "TO_BE_GENERATED_SOLVER_SCS_FALLBACK_SHA256"
      required: false

    experiment_vi_a_feasibility_domain:
      path: "configs/experiments/exp_vi_a_feasibility_domain.yaml"
      sha256: "TO_BE_GENERATED_EXP_VI_A_FEASIBILITY_DOMAIN_SHA256"
      required: true

    experiment_vi_b_delay_robustness:
      path: "configs/experiments/exp_vi_b_delay_robustness.yaml"
