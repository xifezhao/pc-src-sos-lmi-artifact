      path: "results/figures/fig9_lut_deployment_architecture.tex"
      sha256: "TO_BE_GENERATED_FIG9_TEX_SHA256"
      required: true
      min_size_bytes: 512


# ------------------------------------------------------------------------------
# 10. Verification log hashes
# ------------------------------------------------------------------------------

verification_logs:
  mode: "strict"

  files:
    exp_vi_a_validation_report:
      path: "certificates/verification_logs/exp_vi_a_validation_report.json"
      sha256: "TO_BE_GENERATED_EXP_VI_A_VALIDATION_REPORT_SHA256"
      required: false

    exp_vi_b_dual_superset_report:
      path: "certificates/verification_logs/exp_vi_b_dual_superset_report.json"
      sha256: "TO_BE_GENERATED_EXP_VI_B_DUAL_SUPERSET_REPORT_SHA256"
      required: true

    exp_vi_c_stop_and_go_validation_report:
      path: "certificates/verification_logs/exp_vi_c_stop_and_go_validation_report.json"
      sha256: "TO_BE_GENERATED_EXP_VI_C_STOP_AND_GO_VALIDATION_REPORT_SHA256"
      required: true

    exp_vii_lut_integrity_report:
      path: "certificates/verification_logs/exp_vii_lut_integrity_report.json"
      sha256: "TO_BE_GENERATED_EXP_VII_LUT_INTEGRITY_REPORT_SHA256"
      required: true

    exp_vii_lut_o1_lookup_report:
      path: "certificates/verification_logs/exp_vii_lut_o1_lookup_report.json"
      sha256: "TO_BE_GENERATED_EXP_VII_LUT_O1_LOOKUP_REPORT_SHA256"
      required: true


# ------------------------------------------------------------------------------
# 11. Release bundles
# ------------------------------------------------------------------------------

release_bundles:
  paper_reproduction:
    description: "Minimal artifact set required to reproduce paper figures."
    required_groups:
      - "source_configs"
      - "processed_data"
      - "structured_artifacts"
      - "metrics"
      - "figures"

    optional_groups:
      - "certificates"
      - "binary_artifacts"
      - "verification_logs"

  full_artifact:
    description: "Full artifact package including certificates and LUT binaries."
    required_groups:
      - "source_configs"
      - "processed_data"
      - "structured_artifacts"
      - "certificates"
      - "metrics"
      - "binary_artifacts"
      - "figures"
      - "verification_logs"

  ci_smoke:
    description: "Reduced set checked in CI smoke tests."
    required_files:
      - "configs/default.yaml"
      - "configs/validation/tolerances.yaml"
      - "configs/validation/golden_hashes.yaml"
      - "configs/figures/fig9_lut_deployment_architecture.yaml"
    allow_placeholder_hashes: true


# ------------------------------------------------------------------------------
# 12. Placeholder handling
# ------------------------------------------------------------------------------

placeholder_policy:
  placeholder_prefixes:
    - "TO_BE_GENERATED_"

  allow_in_development: true
  allow_in_ci_smoke: true
  allow_in_release: false

  behavior:
    development: "warn"
    ci_smoke: "warn"
    paper: "fail"
    release: "fail"

  generation_command: >
    python -m pcsrc.validation.generate_golden_hashes
    --input configs/validation/golden_hashes.yaml
    --output configs/validation/golden_hashes.yaml
    --profile paper
    --replace-placeholders


# ------------------------------------------------------------------------------
# 13. Validation summary expectations
# ------------------------------------------------------------------------------

expected_validation_summary:
  strict_source_config_hashes: true
  processed_data_semantic_checks: true
  certificate_residual_checks: true
  lut_integrity_hash_check: true
  figure_file_existence_checks: true

  minimum_pass_counts:
    source_configs: 10
    processed_data: 5
    certificates: 2
    metrics: 4
    figures: 10

  failure_policy:
    missing_required_file: "fail"
    hash_mismatch_strict: "fail"
    hash_mismatch_semantic_pass: "warn"
    placeholder_in_release: "fail"
