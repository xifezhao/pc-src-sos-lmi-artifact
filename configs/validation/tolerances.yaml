# ==============================================================================
# configs/validation/tolerances.yaml
#
# Global numerical tolerances and validation thresholds.
#
# Purpose:
#   - Centralize tolerances used across SOS-LMI certification, simulations,
#     figure regeneration, LUT deployment, and CI smoke tests.
#   - Provide strict/default/relaxed profiles for solver-dependent reproducibility.
#   - Avoid duplicated hard-coded tolerances in experiment and figure configs.
#
# Usage examples:
#   python -m pcsrc.validation.run_checks \
#       --tolerances configs/validation/tolerances.yaml
#
#   python -m pcsrc.experiments.exp_vi_a_feasibility_domain \
#       --config configs/experiments/exp_vi_a_feasibility_domain.yaml \
#       --tolerances configs/validation/tolerances.yaml
# ==============================================================================


# ------------------------------------------------------------------------------
# 1. Metadata
# ------------------------------------------------------------------------------

metadata:
  id: "global_validation_tolerances"
  version: "1.0.0"
  description: >
    Global validation tolerances for certificate feasibility, numerical
    simulation, plotting reproducibility, lookup-table deployment, and CI/AE
    smoke tests.

  default_profile: "default"

  compatible_experiments:
    - "exp_vi_a_feasibility_domain"
    - "exp_vi_b_delay_robustness"
    - "exp_vi_c_micro_simulation"
    - "exp_vi_c_stop_and_go"
    - "exp_vii_lut_deployment"

  compatible_figures:
    - "fig5_gain_feasible_domain"
    - "fig6_structural_conservatism"
    - "fig7_space_time_heatmap"
    - "fig8_time_domain_profiles"
    - "fig9_lut_deployment_architecture"


# ------------------------------------------------------------------------------
# 2. Global scalar tolerances
# ------------------------------------------------------------------------------

global:
  absolute: 1.0e-9
  relative: 1.0e-8
  zero: 1.0e-12

  boolean_threshold: 0.5
  binary_value_tolerance: 1.0e-12

  timestamp_tolerance_seconds: 1.0

  hash:
    require_exact_match: true

  floating_point:
    allow_nan: false
    allow_inf: false
    comparison_mode: "abs_or_rel"


# ------------------------------------------------------------------------------
# 3. SOS-LMI and certificate tolerances
# ------------------------------------------------------------------------------

sos_lmi:
  solver_status:
    accepted_statuses:
      strict:
        - "optimal"
      default:
        - "optimal"
        - "optimal_inaccurate"
      relaxed:
        - "optimal"
        - "optimal_inaccurate"
        - "solved"
        - "solved_inaccurate"

    reject_statuses:
      - "infeasible"
      - "unbounded"
      - "infeasible_or_unbounded"
      - "solver_error"
      - "numerical_error"
      - "unknown"

  residuals:
    strict:
      max_primal_residual: 1.0e-7
      max_dual_residual: 1.0e-7
      max_gap: 1.0e-7

    default:
      max_primal_residual: 1.0e-6
      max_dual_residual: 1.0e-6
      max_gap: 1.0e-6

    relaxed:
      max_primal_residual: 5.0e-4
      max_dual_residual: 5.0e-4
      max_gap: 5.0e-4

  eigenvalues:
    strict:
      min_lmi_eigenvalue: -1.0e-8
      min_psd_slack_eigenvalue: -1.0e-8

    default:
      min_lmi_eigenvalue: -1.0e-7
      min_psd_slack_eigenvalue: -1.0e-7

    relaxed:
      min_lmi_eigenvalue: -5.0e-5
      min_psd_slack_eigenvalue: -5.0e-5

  polynomial_residuals:
    strict:
      max_coefficient_residual: 1.0e-8
      max_sos_decomposition_residual: 1.0e-8

    default:
      max_coefficient_residual: 1.0e-7
      max_sos_decomposition_residual: 1.0e-7

    relaxed:
      max_coefficient_residual: 1.0e-5
      max_sos_decomposition_residual: 1.0e-5

  feasibility_classification:
    decision_threshold: 0.5
    margin_tolerance: 1.0e-9
    classify_near_boundary_as: "infeasible"

  certificate_hash:
    require_exact_match: true


# ------------------------------------------------------------------------------
# 4. Grid, contour, and volume tolerances
# ------------------------------------------------------------------------------

grid:
  coordinate_match: 1.0e-9
  spacing_match: 1.0e-12
  rectangularity_tolerance: 1.0e-12
  expected_count_exact: true

  feasibility_binary_tolerance: 1.0e-12

  area:
    absolute: 1.0e-10
    relative: 1.0e-8
    ratio: 1.0e-8

  volume:
    absolute: 1.0e-10
    relative: 1.0e-8
    ratio: 1.0e-8
    nested_order_slack: 1.0e-10

  contour:
    level_match: 1.0e-12
    coordinate_match: 1.0e-8
    min_segment_points: 4
    min_closed_path_area: 1.0e-12

  hull:
    duplicate_point_tolerance: 1.0e-10
    min_positive_volume: 1.0e-12
    min_facets: 4


# ------------------------------------------------------------------------------
# 5. Simulation tolerances
# ------------------------------------------------------------------------------

simulation:
  time:
    t_start_match: 1.0e-12
    t_end_match: 1.0e-9
    dt_match: 1.0e-12
    monotonicity_slack: 1.0e-12

  integrator:
    default_rtol: 1.0e-8
    default_atol: 1.0e-10
    relaxed_rtol: 1.0e-7
    relaxed_atol: 1.0e-9

  state:
    max_abs_position: 1.0e6
    max_abs_velocity: 100.0
    max_abs_acceleration: 3.000001
    max_abs_spacing: 1.0e4
    finite_check: true

  physical:
    acceleration_min: -3.0
    acceleration_max: 3.0
    acceleration_bound_tolerance: 1.0e-6

    spacing_min_strictly_greater_than: 0.0
    spacing_positive_tolerance: 1.0e-9

    collision_boundary: 0.0
    collision_tolerance: 1.0e-9

  wave:
    peak_time_tolerance: 0.10
    peak_amplitude_tolerance: 1.0e-4
    attenuation_ratio_tolerance: 1.0e-3

    default_max_cav_peak_over_last_hdv_peak: 0.70
    default_max_cav_rms_over_last_hdv_rms: 0.80

    noisy_max_cav_peak_over_last_hdv_peak: 0.80
    noisy_max_cav_rms_over_last_hdv_rms: 0.90

  comfort:
    jerk_gradient_tolerance: 1.0e-6


# ------------------------------------------------------------------------------
# 6. Controller and gain tolerances
# ------------------------------------------------------------------------------

controller:
  gains:
    kp_match: 1.0e-9
    kv_match: 1.0e-9
    ka_match: 1.0e-9

    bounds_tolerance: 1.0e-12

    nominal:
      kp: 1.15
      kv: 1.18
      ka: 0.61
      match_tolerance: 1.0e-9

    fixed_ka_slice:
      ka: 0.80
      match_tolerance: 1.0e-9

  delay:
    tau_c_match: 1.0e-9
    tau_e_match: 1.0e-9
    delta_max_match: 1.0e-9

    bounds_tolerance: 1.0e-12


# ------------------------------------------------------------------------------
# 7. LUT deployment tolerances
# ------------------------------------------------------------------------------

lut:
  dimensions:
    coordinate_match: 1.0e-9
    clamp_tolerance: 1.0e-12
    expected_cell_count_exact: true

  lookup:
    max_average_lookup_time_microseconds: 100.0
    max_p99_lookup_time_microseconds: 250.0
    timing_relative_tolerance: 0.15
    index_exact: true

  memory:
    max_kb: 512.0
    tolerance_kb: 1.0

  integrity:
    require_sha256_exact_match: true
    hash_length: 64

  nearest_feasible:
    max_fill_distance_cells:
      default: 2
      relaxed: 4
    require_source_cell_record: true

  export:
    require_no_empty_cells: true
    allow_filled_infeasible_cells: true


# ------------------------------------------------------------------------------
# 8. Figure rendering tolerances
# ------------------------------------------------------------------------------

figures:
  data:
    required_columns_exact: true
    input_hash_required: false
    nonempty_min_rows: 1

  axes:
    limit_match: 1.0e-12
    tick_match: 1.0e-12

  raster:
    image_compare_enabled: false
    rms_pixel_tolerance: 2.0e-3
    max_pixel_tolerance: 1.0e-2

  vector:
    require_pdf_exists: true
    require_tex_exists: true
    min_file_size_bytes:
      pdf: 1024
      tex: 512
      png: 1024

  layout:
    node_position_tolerance: 1.0e-9
    canvas_bounds_tolerance: 1.0e-9


# ------------------------------------------------------------------------------
# 9. File, metadata, and reproducibility tolerances
# ------------------------------------------------------------------------------

files:
  require_existing: true
  require_nonempty: true
  min_size_bytes: 1
  path_case_sensitive: true

metadata:
  require_config_hash: true
  require_git_commit: false
  require_python_version: true
  require_timestamp_utc: true
  timestamp_format: "iso8601"

reproducibility:
  random_seed_expected: 20260816
  deterministic_order_required: true
  allow_platform_dependent_solver_variation: true


# ------------------------------------------------------------------------------
# 10. Profiles
# ------------------------------------------------------------------------------

profiles:
  strict:
    description: "Strict profile for MOSEK-backed paper reproduction."

    inherit: "default"
    overrides:
      sos_lmi:
        residual_profile: "strict"
        eigenvalue_profile: "strict"
        polynomial_residual_profile: "strict"
      simulation:
        integrator:
          rtol: 1.0e-9
          atol: 1.0e-11

  default:
    description: "Default profile for normal local reproduction."

    sos_lmi:
      residual_profile: "default"
      eigenvalue_profile: "default"
      polynomial_residual_profile: "default"

    simulation:
      integrator:
        rtol: 1.0e-8
        atol: 1.0e-10

  relaxed:
    description: "Relaxed profile for first-order solvers and license-free fallback."

    inherit: "default"
    overrides:
      sos_lmi:
        residual_profile: "relaxed"
        eigenvalue_profile: "relaxed"
        polynomial_residual_profile: "relaxed"

      simulation:
        integrator:
          rtol: 1.0e-7
          atol: 1.0e-9

      figures:
        raster:
          image_compare_enabled: false

  ci:
    description: "CI smoke-test profile with relaxed solver tolerances."

    inherit: "relaxed"
    overrides:
      files:
        require_nonempty: true
      metadata:
        require_git_commit: false

  ae_fast:
    description: "Artifact-evaluation fast profile."

    inherit: "relaxed"
    overrides:
      sos_lmi:
        residual_profile: "relaxed"
        eigenvalue_profile: "relaxed"
      grid:
        expected_count_exact: true
      simulation:
        wave:
          default_max_cav_peak_over_last_hdv_peak: 0.85
          default_max_cav_rms_over_last_hdv_rms: 0.95
