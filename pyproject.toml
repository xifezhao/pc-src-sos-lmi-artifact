[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pcsrc"
version = "2.1.3"
description = "Reproducible SOS-LMI and Mixed Traffic Platoon Simulation Artifact for IEEE T-ITS"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Haiying Dong", email = "hydong@mail.lzjtu.cn"},
    {name = "Xiaofei Zhao", email = "xifizhao@gmail.com"},
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "cvxpy>=1.4",
    "clarabel>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
